<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #444;
            margin: 0;
            padding: 30px 15px;
        }

        form {
            width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #f26522;
            margin-top: 0;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #f26522;
            background-color: #fff4ee;
        }

        .titulo {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .opcoes label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }

        input[type="file"] {
            font-size: 14px;
        }

        .botoes {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .enviar {
            background-color: #f26522;
        }

        .enviar:hover {
            background-color: #c94e12;
        }

        .limpar {
            background-color: #777;
        }

        .limpar:hover {
            background-color: #555;
        }

        @media (max-width: 600px) {
            form {
                width: 100%;
                padding: 18px;
            }

            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <form action="#" method="post">
        <h1>Formulário de Cadastro</h1>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <div class="campo">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento">
        </div>

        <div class="campo">
            <label for="curso">Curso</label>
            <select id="curso" name="curso">
                <option value="">Selecione um curso</option>
                <option value="si">Sistemas de Informação</option>
                <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                <option value="cc">Ciência da Computação</option>
                <option value="es">Engenharia de Software</option>
            </select>
        </div>

        <div class="campo opcoes">
            <span class="titulo">Sexo</span>
            <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
            <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
            <label><input type="radio" name="sexo" value="outro"> Outro</label>
        </div>

        <div class="campo opcoes">
            <span class="titulo">Interesses</span>
            <label><input type="checkbox" name="interesses" value="programacao"> Programação</label>
            <label><input type="checkbox" name="interesses" value="jogos"> Jogos</label>
            <label><input type="checkbox" name="interesses" value="esportes"> Esportes</label>
            <label><input type="checkbox" name="interesses" value="musica"> Música</label>
        </div>

        <div class="campo">
            <label for="comentarios">Comentários</label>
            <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escreva aqui..."></textarea>
        </div>

        <div class="campo">
            <label for="foto">Upload de foto</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>

        <div class="botoes">
            <button type="submit" class="enviar">Enviar</button>
            <button type="reset" class="limpar">Limpar</button>
        </div>
    </form>

</body>
</html>
